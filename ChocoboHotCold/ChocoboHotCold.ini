; Chocobo Hot & Cold Radar 1.0.1
; 陆行鸟挖宝雷达 —— 实时标出当前宝藏的挖掘点、方位与距离。
; 修改后请退出并重启游戏；当前版本仅在覆盖层首次创建时读取配置。

[ChocoboHotCold]
; 总开关（1 = 开启，0 = 关闭）
Enabled = 1

; 在场景里直接标出宝藏位置（地面光环 + 浮动标记 + 距离）
ShowWorldMarker = 1

; 屏幕上方中央的罗盘箭头（相对镜头方向），并显示距离
ShowCompass = 1

; 是否显示距离（单位：米，按 UnitsPerMeter 换算）
ShowDistance = 1

; 是否把游戏自己的「Kweh」强度（1~5 级）显示为 5 个小圆点
ShowKweh = 1

; 是否同时显示全部 9 个候选挖掘点（小黄点，调试/观察用）
ShowAllPoints = 0

; 只在挖宝小游戏计时进行中显示（1 = 是，0 = 只要在三个场地就显示）
OnlyDuringMinigame = 0

; 距离换算：多少游戏坐标单位 = 1 米（默认 100，可按手感调整）
UnitsPerMeter = 100

; 整体 UI 缩放（1080p 基准，1.0 = 原始大小）
Scale = 1.0

; 世界标记离地高度（游戏坐标单位，默认 70）
MarkerHeight = 70
